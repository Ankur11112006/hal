# Render Blueprint. Must live at the repo ROOT, not inside backend/.
#
# Deploy: render.com -> New -> Blueprint -> pick this repo -> Apply.
# Then set GEMINI_API_KEY in the dashboard (it is sync:false, so Render will
# prompt for it and it never touches the repo).

# The service is still called bahi-backend, on purpose, even though the GitHub
# repo was renamed to hal on 17 August. Renaming it here does not rename the
# Render service, it creates a SECOND one on a different URL, and the URL is
# compiled into the APK. The name is invisible to users; the working URL is not.
services:
  - type: web
    name: bahi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GEMINI_API_KEY
        sync: false          # set in the dashboard, never in the repo
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest

# Two things the free tier does NOT give you, both deliberate here:
#
# 1. No persistent disk. SQLite therefore lives on ephemeral storage and is
#    wiped on every restart and redeploy. Survivable only because the phone can
#    be told to send it all again: /health returns a boot_id that changes on
#    every restart, and a phone seeing an unfamiliar one re-sends its whole
#    event log. Without that the wipe was permanent, since the phone had already
#    marked those rows synced and would never offer them again, and the advisory
#    answered "koi record nahi mila" about a farm with two years of history.
#    Move to Postgres before any real farmer data exists.
#
# 2. The instance sleeps after 15 minutes idle and takes ~50s to wake. Ping
#    /health five minutes before the demo, or run uvicorn on the presenting
#    laptop and point the app at it from Settings -> सर्वर पता.

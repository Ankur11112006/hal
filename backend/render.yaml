services:
  - type: web
    name: bahi-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GEMINI_API_KEY
        sync: false          # set in the Render dashboard, never in the repo
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: BAHI_DB
        value: /var/data/bahi.db
    disk:
      name: bahi-data
      mountPath: /var/data
      sizeGB: 1

# The free instance sleeps after 15 minutes idle and takes ~50s to wake.
# Ping /health five minutes before the demo, or run uvicorn on the presenting
# laptop. SPEC.md 6.1.
